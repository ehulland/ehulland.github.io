name: Build and deploy Quarto site

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'talkmap/geocache.json'
      - '.github/workflows/quarto-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests markdown

      - name: Generate talks JSON
        run: python scripts/generate_talks_geo.py

      - name: Build site pages from source content
        run: python scripts/build_site_pages.py

      - name: Commit rendered `docs/` back to `main`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure we are on the main branch
          git checkout main || git switch main
          # Add and commit generated site
          git add -A docs
          git commit -m "Deploy site from CI: $GITHUB_SHA [skip ci]" || echo "No changes to commit"
          git push origin main
