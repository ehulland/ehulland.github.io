name: Build and deploy Quarto site

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'talkmap/geocache.json'
      - '.github/workflows/quarto-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Generate talks JSON
        run: python scripts/generate_talks_geo.py

      - name: Install Quarto CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget
          TAG=$(wget -qO- https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          ASSET_URL="https://github.com/quarto-dev/quarto-cli/releases/download/${TAG}/quarto-${VER}-linux-amd64.deb"
          wget -qO quarto.deb "${ASSET_URL}"
          sudo apt-get install -y ./quarto.deb

      - name: Render site with Quarto
        run: quarto render --output-dir docs

      - name: Commit rendered `docs/` back to `main`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure we are on the main branch
          git checkout main || git switch main
          # Add and commit generated site
          git add -A docs
          git commit -m "Deploy site from CI: $GITHUB_SHA [skip ci]" || echo "No changes to commit"
          git push origin main
