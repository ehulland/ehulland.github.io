name: Build and deploy Quarto site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Quarto CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y jq wget
          TAG=$(wget -qO- https://api.github.com/repos/quarto-dev/quarto-cli/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          ASSET_URL="https://github.com/quarto-dev/quarto-cli/releases/download/${TAG}/quarto-${VER}-linux-amd64.deb"
          wget -qO quarto.deb "${ASSET_URL}"
          sudo apt-get install -y ./quarto.deb

      - name: Render site with Quarto
        run: quarto render --output-dir docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
